<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#A5402D">
  <meta name="color-scheme" content="light">
  <link rel="manifest" href="manifest.webmanifest">
  <script>
    // Aplica el tamaño de letra antes de pintar, para evitar parpadeos.
    (function () {
      try {
        var guardado = localStorage.getItem("biblia:letra");
        var indice =
          guardado === null || guardado === "" ? 1 : Number(guardado);
        var tamanos = [22, 26, 30, 34, 38, 42];

        if (
          !Number.isInteger(indice) ||
          indice < 0 ||
          indice >= tamanos.length
        ) {
          indice = 1;
        }

        document.documentElement.style.setProperty(
          "--tam-letra",
          tamanos[indice] + "px"
        );
      } catch (error) {
        document.documentElement.style.setProperty("--tam-letra", "26px");
      }
    })();
  </script>
  <title>Biblia</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="encabezado">
    <h1>Biblia</h1>
  </header>
  <main id="app" class="contenido"></main>
  <script src="js/app.js"></script>
</body>
</html>
